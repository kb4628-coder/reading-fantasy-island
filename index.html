<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>閱讀奇幻島 - 寵物養成與雙語自學冒險</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 960px; margin: 0 auto; }

    /* 頂部導航與狀態面板 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    /* 寵物狀態小卡 */
    .pet-widget {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .pet-avatar {
      font-size: 2.2rem;
      animation: bounce 2s infinite ease-in-out;
      cursor: pointer;
      user-select: none;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .pet-info { display: flex; flex-direction: column; gap: 4px; }
    .pet-name-lv { font-size: 0.9rem; font-weight: 700; color: #334155; }
    .stat-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .exp-bar-bg { width: 100px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .exp-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #a855f7); transition: width 0.3s; }
    .coins-badge { background: #fef3c7; color: #b45309; padding: 2px 8px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; }

    /* 寵物互動撫摸彈窗/餵食區 */
    .pet-modal {
      background: linear-gradient(135deg, #eef2ff, #fdf4ff);
      border: 2px dashed #c7d2fe;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .pet-dialogue { font-size: 0.95rem; font-weight: 600; color: #4338ca; }
    .pet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .feed-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .feed-btn:hover { background: #d97706; }

    /* 寵物技能列 (Pet Skills) */
    .skills-section {
      background: #ffffff;
      border: 2px solid #e0e7ff;
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(99,102,241,0.06);
    }
    .skills-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .skills-title {
      font-weight: 800;
      color: var(--primary);
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .skill-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .skill-card.locked {
      opacity: 0.6;
      background: #f1f5f9;
      border-style: dashed;
    }
    .skill-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .skill-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .skill-cast-btn {
      margin-top: 4px;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .skill-cast-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .skill-cast-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    /* 導覽列與過濾 */
    .filter-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* 關卡選單卡片 */
    .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .level-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 2px solid transparent;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .level-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 10px 15px -3px rgba(99,102,241,0.15); }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
    .badge-zh { background: #fee2e2; color: #dc2626; }
    .badge-en { background: #dbeafe; color: #2563eb; }
    .badge-tier { background: #f1f5f9; color: #475569; margin-left: 4px; }
    .card-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 8px; color: #1e293b; }
    .card-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

    /* 閱讀挑戰主區塊 */
    .game-area { display: none; background: white; border-radius: 20px; padding: 28px; box-shadow: 0 10px 20px -5px rgba(0,0,0,0.08); }
    .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .back-btn { background: #f1f5f9; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: #475569; }
    .back-btn:hover { background: #e2e8f0; }

    /* 語音控制條 */
    .tts-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 30px;
    }
    .tts-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
    }
    .tts-btn:hover { opacity: 0.8; }
    .tts-status { font-size: 0.8rem; color: #3b82f6; font-weight: 600; }

    /* 文本閱讀區 */
    .reading-box {
      background: #fbfcfe;
      border-left: 5px solid var(--primary);
      padding: 20px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 24px;
      line-height: 2;
      font-size: 1.15rem;
      color: #1e293b;
      letter-spacing: 0.5px;
    }
    .reading-box p { margin-bottom: 14px; }
    .reading-box p:last-child { margin-bottom: 0; }

    /* 單詞發音標籤 */
    .vocab-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 18px; margin-bottom: 24px; }
    .vocab-title { font-size: 0.95rem; font-weight: 700; color: #b45309; margin-bottom: 10px; }
    .vocab-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .vocab-tag {
      background: white;
      border: 1px solid #fcd34d;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .vocab-tag:hover { transform: scale(1.03); }
    .speak-word-icon { color: var(--primary); }

    /* 題目區 */
    .quiz-card { margin-bottom: 20px; padding: 20px; border: 2px solid #e2e8f0; border-radius: 14px; background: #fafafa; }
    .question-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 14px; color: #0f172a; }
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn {
      text-align: left;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: white;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.15s;
      font-weight: 500;
    }
    .opt-btn:hover:not(:disabled) { background: #f8fafc; border-color: var(--primary); }
    .opt-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d; font-weight: bold; }
    .opt-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c; }

    /* 回饋提示盒 */
    .feedback-box { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; display: none; line-height: 1.6; }
    .feedback-hint { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .feedback-correct { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }

    /* 獎勵打地鼠中英配對小遊戲 (Whack-a-Mole Vocab Game) */
    .mini-game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .mini-game-card {
      background: #ffffff;
      border-radius: 24px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
      border: 4px solid #facc15;
    }
    .mole-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .mole-stat {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1e293b;
      background: #fef08a;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .target-prompt-box {
      background: linear-gradient(135deg, #e0e7ff, #ede9fe);
      border: 2px solid #818cf8;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .target-word-title {
      font-size: 0.85rem;
      color: #4338ca;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .target-word-display {
      font-size: 1.6rem;
      font-weight: 900;
      color: #312e81;
      letter-spacing: 1px;
    }
    .mole-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .mole-hole {
      background: #78350f;
      border: 4px solid #451a03;
      border-radius: 16px;
      height: 96px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      box-shadow: inset 0 8px 10px rgba(0,0,0,0.5);
    }
    .mole-creature {
      position: absolute;
      width: 90%;
      height: 80%;
      bottom: -100%;
      background: #fbbf24;
      border: 2px solid #d97706;
      border-radius: 14px 14px 6px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #78350f;
      transition: bottom 0.15s ease-out;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .mole-creature.up {
      bottom: 6px;
    }
    .mole-creature.whacked-correct {
      background: #4ade80 !important;
      border-color: #16a34a !important;
      color: #14532d !important;
      transform: scale(0.92);
    }
    .mole-creature.whacked-wrong {
      background: #f87171 !important;
      border-color: #dc2626 !important;
      color: #7f1d1d !important;
      transform: scale(0.92);
    }

    /* 滑鼠反白劃詞翻譯懸浮小氣泡 (Selection Dictionary Tooltip) */
    .word-tooltip {
      position: absolute;
      display: none;
      z-index: 9999;
      background: #1e293b;
      color: #ffffff;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 10px 25px -3px rgba(0,0,0,0.3);
      font-size: 0.88rem;
      max-width: 280px;
      pointer-events: auto;
      border: 1px solid #475569;
      animation: fadeInTooltip 0.15s ease-out;
    }
    @keyframes fadeInTooltip {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tooltip-arrow {
      position: absolute;
      bottom: -6px;
      left: 20px;
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #1e293b;
    }
    .tooltip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .tooltip-word {
      font-weight: 800;
      font-size: 1.05rem;
      color: #38bdf8;
    }
    .tooltip-speak-btn {
      background: #334155;
      border: none;
      color: #f8fafc;
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .tooltip-speak-btn:hover {
      background: #475569;
      color: #38bdf8;
    }
    .tooltip-trans {
      color: #f1f5f9;
      font-size: 0.92rem;
      line-height: 1.4;
      font-weight: 500;
    }
  </style>
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部資訊與寵物狀態列 -->
  <div class="top-bar">
    <div class="brand-title">
      <span>🏝️</span> 閱讀奇幻島
    </div>

    <!-- 寵物養成即時資訊卡 -->
    <div class="pet-widget" id="petWidget">
      <div class="pet-avatar" id="petAvatar" onclick="petInteract()" title="摸摸小寵物！">🐣</div>
      <div class="pet-info">
        <div class="pet-name-lv">
          <span id="petName">泡泡精靈</span> · <span id="petLevel">Lv.1 破殼幼體</span>
        </div>
        <div class="stat-row">
          <span>❤️ 生命精華:</span>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
          </div>
          <span id="expText">0/100 HP</span>
        </div>
      </div>
      <div class="coins-badge">🪙 <span id="coinCount">0</span></div>
    </div>
  </div>

  <!-- 寵物互動與餵食區 -->
  <div class="pet-modal" id="petBanner">
    <div class="pet-dialogue" id="petDialogue">
      「主人，今天我們來讀哪篇故事呢？答對題目賺金幣可以買點心給我吃喔！」
    </div>
    <div class="pet-actions">
      <button class="feed-btn" onclick="feedPet(30)">
        🍎 餵食點心 (需 30🪙)
      </button>
      <button class="feed-btn" style="background:#8b5cf6;" onclick="feedPet(60)">
        🍖 豪華大餐 (需 60🪙)
      </button>
    </div>
  </div>

  <!-- 寵物專屬技能修煉所 -->
  <div class="skills-section">
    <div class="skills-header">
      <div class="skills-title">⚡ 寵物專屬閱讀技能 (隨等級解鎖，可在答題時使用)</div>
      <div style="font-size:0.85rem; color:var(--text-muted);">答題遇到困難時召喚寵物相助！</div>
    </div>
    <div class="skills-grid" id="skillsGrid"></div>
  </div>

  <!-- 年級與語言過濾器 -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">全部關卡</button>
    <button class="filter-btn" data-filter="lower">低年級 (1-2年級)</button>
    <button class="filter-btn" data-filter="middle">中年級 (3-4年級)</button>
    <button class="filter-btn" data-filter="upper">高年級 (5-6年級)</button>
    <button class="filter-btn" data-filter="zh">中文限定</button>
    <button class="filter-btn" data-filter="en">英文限定</button>
    <button class="filter-btn" style="background:#10b981; color:white; border-color:#10b981;" onclick="openAddStoryModal()">➕ 快速匯入新故事</button>
  </div>

  <!-- 新增故事互動彈窗 Modal (純文字極速模式) -->
  <div id="addStoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55); z-index:999; justify-content:center; align-items:center; padding:16px;">
    <div style="background:white; border-radius:18px; max-width:620px; width:100%; max-height:92vh; overflow-y:auto; padding:24px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.25);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="color:var(--primary); font-size:1.35rem; display:flex; align-items:center; gap:6px;">
          <span>📝</span> 純文字極速匯入故事
        </h3>
        <button onclick="closeAddStoryModal()" style="border:none; background:none; font-size:1.4rem; cursor:pointer;">✖</button>
      </div>
      <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:16px; line-height:1.5;">
        完全不需要任何代碼或複雜格式！只要把故事文章直接貼上來，系統會自動分段、提取重點詞彙、並自動生成閱讀測驗題目！
      </p>

      <div style="display:flex; flex-direction:column; gap:14px;">
        <div>
          <label style="font-size:0.9rem; font-weight:700; color:#334155; display:block; margin-bottom:4px;">故事標題（可選）：</label>
          <input type="text" id="quickStoryTitle" placeholder="例如：三隻小豬的冒險（留空則自動命名）" style="width:100%; padding:9px 12px; border-radius:8px; border:1px solid #cbd5e1; font-size:0.95rem;">
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <div style="flex:1; min-width:140px;">
            <label style="font-size:0.85rem; font-weight:700; color:#334155; display:block; margin-bottom:4px;">語言：</label>
            <select id="quickStoryLang" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; font-size:0.9rem; background:white;">
              <option value="auto">自動判斷 (中文 / 英文)</option>
              <option value="zh">中文</option>
              <option value="en">English (英文)</option>
            </select>
          </div>
          <div style="flex:1; min-width:140px;">
            <label style="font-size:0.85rem; font-weight:700; color:#334155; display:block; margin-bottom:4px;">年級對象：</label>
            <select id="quickStoryTier" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; font-size:0.9rem; background:white;">
              <option value="lower">低年級 (1-2年級)</option>
              <option value="middle" selected>中年級 (3-4年級)</option>
              <option value="upper">高年級 (5-6年級)</option>
            </select>
          </div>
        </div>

        <div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <label style="font-size:0.9rem; font-weight:700; color:#334155;">請貼上故事文章內容：</label>
            <button onclick="fillPlainTextSample()" style="font-size:0.8rem; padding:3px 8px; border-radius:6px; border:1px solid #cbd5e1; background:#f8fafc; cursor:pointer;">填入範例文章測試</button>
          </div>
          <textarea id="quickStoryText" rows="9" style="width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:12px; font-size:0.95rem; line-height:1.6;" placeholder="在此直接貼上任何中文或英文純文字故事..."></textarea>
        </div>
      </div>

  },
  {
    id: "highlight_hint",

    icon: "💡",

    costCoins: 15,

  },
  {
    id: "double_reward",
    name: "幸運金幣術",
    icon: "🍀",
    unlockLevel: 4,
    costCoins: 20,
    desc: "下一題若答對，獲得的經驗值與金幣全部翻倍 (x2)！"
  },
  {
    id: "auto_solve",
    name: "書龍真言",
    icon: "🐲",

];

let activeBuffs = {
  doubleReward: false
};

function renderSkillsUI() {
  const container = document.getElementById('skillsGrid');
  if (!container) return;
  container.innerHTML = '';

  petSkills.forEach(skill => {
    const isUnlocked = petState.level >= skill.unlockLevel;
    const card = document.createElement('div');
    card.className = `skill-card ${isUnlocked ? '' : 'locked'}`;
    
    card.innerHTML = `
      <div class="skill-name-row">
        <span>${skill.icon} ${skill.name}</span>
        <span style="font-size:0.75rem; color:${isUnlocked ? '#10b981' : '#94a3b8'};">
          ${isUnlocked ? '已掌握' : `需 Lv.${skill.unlockLevel}`}
        </span>
      </div>
      <div class="skill-desc">${skill.desc}</div>
      <div style="font-size:0.75rem; color:#b45309; font-weight:700;">消耗: ${skill.costCoins} 🪙</div>
    `;
    container.appendChild(card);
  });
}

function renderInGameSkillBar() {
  const bar = document.getElementById('inGameSkillBar');
  if (!bar) return;
  bar.innerHTML = '<span style="font-size:0.85rem; font-weight:700; color:var(--primary);">寵物助戰:</span>';

  petSkills.forEach(skill => {
    const isUnlocked = petState.level >= skill.unlockLevel;
    if (isUnlocked) {
      const btn = document.createElement('button');
      btn.className = 'skill-cast-btn';
      btn.innerHTML = `${skill.icon} ${skill.name} (${skill.costCoins}🪙)`;
      btn.onclick = () => castSkill(skill.id, skill.costCoins);
      bar.appendChild(btn);
    }
  });
}

function castSkill(skillId, cost) {
  if (petState.coins < cost) {
    alert("金幣不足，無法釋放此技能！快去多答題賺金幣吧！");
    return;
  }

  const targetCard = document.getElementById('active_quiz_card');
  if (!targetCard) return;

  // 取得當前題目
  const qIdx = currentQuestionQueue[currentQuestionCursor];
  const currentQ = currentLevel.questions[qIdx];

  if (skillId === 'eliminate_wrong') {
    const wrongBtns = Array.from(targetCard.querySelectorAll('.opt-btn')).filter((btn, idx) => {
      return idx !== currentQ.answer_index && !btn.classList.contains('wrong');
    });
    if (wrongBtns.length > 0) {
      petState.coins -= cost;
      savePetData();
      wrongBtns[0].classList.add('wrong');
      wrongBtns[0].disabled = true;
      showPetDialogue(`👁️ 寵物發動【透視迷霧】！已幫你排除一個錯誤選項！`);
    } else {
      alert("錯誤選項已經都被排除了！");
    }
  } else if (skillId === 'highlight_hint') {
    petState.coins -= cost;
    savePetData();
    const feedback = targetCard.querySelector('.feedback-box');
    feedback.className = 'feedback-box feedback-hint';
    feedback.style.display = 'block';
    feedback.innerHTML = `💡 <strong>【智慧靈光】核心線索：</strong> ${currentQ.hint}`;
    showPetDialogue(`💡 寵物發動【智慧靈光】！已為你顯現本題的解題線索！`);
  } else if (skillId === 'double_reward') {
    petState.coins -= cost;
    savePetData();
    activeBuffs.doubleReward = true;
    showPetDialogue(`🍀 寵物發動【幸運金幣術】！本題答對生命精華與金幣翻倍！`);
    alert("🍀 幸運加倍發動！答對生命精華 +60 HP！");
  } else if (skillId === 'auto_solve') {
    petState.coins -= cost;
    savePetData();
    const correctBtn = targetCard.querySelectorAll('.opt-btn')[currentQ.answer_index];
    correctBtn.click();
    showPetDialogue(`🐲 寵物釋放【書龍真言】！神聖力量直接為你解開了這道題！`);
  }
}

function loadPetData() {
  const saved = localStorage.getItem('reading_game_pet');
  if (saved) {
    try { petState = JSON.parse(saved); } catch (e) {}
  }
  updatePetUI();
}

function savePetData() {
  localStorage.setItem('reading_game_pet', JSON.stringify(petState));
  updatePetUI();
}

function updatePetUI() {
  document.getElementById('coinCount').innerText = petState.coins;
  document.getElementById('petLevel').innerText = `Lv.${petState.level}`;
  document.getElementById('expText').innerText = `${petState.exp}/${petState.maxExp} ❤️`;
  const pct = Math.min(100, (petState.exp / petState.maxExp) * 100);
  document.getElementById('expFill').style.width = `${pct}%`;

  // 檢查外型進化
  let currentForm = petEvolutions[0].form;
  let currentTitle = petEvolutions[0].title;
  for (let evo of petEvolutions) {
    if (petState.level >= evo.level) {
      currentForm = evo.form;
      currentTitle = evo.title;
    }
  }
  document.getElementById('petAvatar').innerText = currentForm;
  document.getElementById('petLevel').innerText = currentTitle;

  // 同步刷新技能面板
  renderSkillsUI();
  renderInGameSkillBar();
}

function gainExpAndCoins(expGain, coinGain) {
  petState.exp += expGain;
  petState.coins += coinGain;
  
  // 升級判定
  if (petState.exp >= petState.maxExp) {
    petState.exp -= petState.maxExp;
    petState.level += 1;
    petState.maxExp = Math.round(petState.maxExp * 1.3);
    showPetDialogue(`🎉 哇！小寵物升級到 ${petState.level} 級了！智慧與力量大增！`);
  }
  savePetData();
}

function petInteract() {
  const quotes = [
    "「摸摸好舒服喔！謝謝主人～繼續加油讀書！」",
    "「我正在吸收書本裡的智慧微光呢～」",
    "「多聽語音朗讀，英文中文都可以進步更快喔！」",
    "「好想吃紅蘋果喔！有金幣可以買給我吃嗎？」"
  ];
  showPetDialogue(quotes[Math.floor(Math.random() * quotes.length)]);
}

function feedPet(cost) {
  if (petState.coins < cost) {
    showPetDialogue("「金幣不夠了！快去挑戰更多閱讀題目賺取金幣吧～」");
    return;
  }
  petState.coins -= cost;
  const expReward = cost === 30 ? 40 : 100;
  gainExpAndCoins(expReward, 0);
  showPetDialogue(`😋「嚼嚼嚼...好好吃喔！獲得了 ${expReward} 點成長經驗值！」`);
}

function showPetDialogue(msg) {
  document.getElementById('petDialogue').innerText = msg;

// =========================
// 語音朗讀系統 (Web Speech API)
// =========================
let currentUtterance = null;
let isSpeaking = false;
let currentLanguage = 'zh-TW';
let currentFullText = '';

function speakText(text, lang) {
  if (!('speechSynthesis' in window)) {
    alert("您的瀏覽器暫時不支援語音合成功能，建議使用 Chrome 或 Edge 瀏覽器！");
    return;
  }
  window.speechSynthesis.cancel(); // 停止目前所有發音

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang === 'en' ? 'en-US' : 'zh-TW';
  utter.rate = lang === 'en' ? 0.9 : 0.95; // 稍微放慢一點點以利學生自學聆聽
  
  utter.onstart = () => {
    isSpeaking = true;
    updateTTSButton(true);
  };
  utter.onend = () => {
    isSpeaking = false;
    updateTTSButton(false);
  };
  utter.onerror = () => {
    isSpeaking = false;
    updateTTSButton(false);
  };

  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function toggleReadPassage() {
  if (isSpeaking) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
    updateTTSButton(false);
  } else {
    speakText(currentFullText, currentLanguage);
  }
}

function updateTTSButton(speaking) {
  const icon = document.getElementById('ttsIcon');
  const label = document.getElementById('ttsLabel');
  const status = document.getElementById('ttsStatus');
  if (speaking) {
    icon.innerText = "⏹️";
    label.innerText = "停止朗讀";
    status.innerText = "（朗讀中...）";
  } else {
    icon.innerText = "🔊";
    label.innerText = "朗讀全文";
    status.innerText = "";
  }
}

// 作答判定
function handleAnswerSelection(qIdx, selectedOptIdx, answerIdx, encodedHint, encodedExp) {
  const card = document.getElementById('active_quiz_card');
  const btns = card.querySelectorAll('.opt-btn');
  const feedback = document.getElementById('active_feedback_box');
  const nextArea = document.getElementById('nextQuestionArea');
  const exp = decodeURIComponent(encodedExp);
  const q = currentLevel.questions[qIdx];
  const correctOptionLetter = String.fromCharCode(65 + answerIdx);
  const correctOptionText = q.options[answerIdx];

  // 鎖定所有選項按鈕
  btns.forEach(b => b.disabled = true);

  if (selectedOptIdx === answerIdx) {
    // 答對了
    btns[selectedOptIdx].classList.add('correct');
    feedback.className = 'feedback-box feedback-correct';
    feedback.style.display = 'block';

    let lifeGain = 30; // 獲得生命精華讓寵物長大
    let coinGain = 15;
    if (activeBuffs.doubleReward) {
      lifeGain *= 2;
      coinGain *= 2;
      activeBuffs.doubleReward = false;
      feedback.innerHTML = `🎉 <strong>答對了！【幸運加倍生效】</strong><br>💖 獲得雙倍生命精華 +${lifeGain} HP！寵物快速成長中！<br>📖 ${exp}`;
    } else {
      feedback.innerHTML = `🎉 <strong>答對了！</strong><br>💖 獲得生命精華 +${lifeGain} HP！小寵物吸收生命成長茁壯！<br>📖 ${exp}`;
    }

    gainExpAndCoins(lifeGain, coinGain);
    showPetDialogue(`「哇！得到 ${lifeGain} HP 生命精華！我感覺身體變大、更有力氣了！」`);

    // 單題答對時直接顯示下一題
    nextArea.innerHTML = `
      <button onclick="goToNextQuestion()" style="padding:10px 22px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.95rem; cursor:pointer;">
        下一題 ➔
      </button>
    `;
  } else {
    // 答錯了：標示錯誤、立即亮出正確答案與詳解，並記錄到錯題隊列
    btns[selectedOptIdx].classList.add('wrong');
    btns[answerIdx].classList.add('correct'); // 自動高亮正確答案

    feedback.className = 'feedback-box feedback-hint';
    feedback.style.display = 'block';
    feedback.innerHTML = `
      ❌ <strong>答錯了！正確答案是 (${correctOptionLetter})：${correctOptionText}</strong><br>
      📌 <strong>解析說明：</strong> ${exp}<br>
      💡 <strong>溫馨提醒：</strong> 這道題已加入「錯題溫習本」，等整份題目完成後會再次讓您重新練習，直到完全答對為止！
    `;

    // 記錄這題，待輪次結束後再次重做
    if (!wrongQuestionQueue.includes(qIdx)) {
      wrongQuestionQueue.push(qIdx);
    }
    showPetDialogue("「別灰心！先記下正確答案與解析，等一下我們會再練習一次直到答對！」");

    nextArea.innerHTML = `
      <button onclick="goToNextQuestion()" style="padding:10px 22px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:700; font-size:0.95rem; cursor:pointer;">
        下一題 ➔
      </button>
    `;
  }

  // 顯示操作按鈕區
  nextArea.style.display = 'block';
}

  currentQuestionCursor++;
  renderCurrentQuestion();
}

];

let moleTimer = 60;
let moleScore = 0;
let moleTimerInterval = null;
let moleSpawnInterval = null;
let currentTargetPair = null;
let activeMoles = {}; // holeIndex -> { text, isCorrect }

function openMoleGame() {
  document.getElementById('moleModal').style.display = 'flex';
  startMoleGame();
}

function startMoleGame() {
  moleTimer = 60;
  moleScore = 0;
  document.getElementById('moleTimer').innerText = moleTimer;
  document.getElementById('moleScore').innerText = moleScore;

  // 重置地鼠洞
  for (let i = 0; i < 9; i++) {
    const el = document.getElementById(`mole${i}`);
    el.className = 'mole-creature';
    el.innerText = '';
  }
  activeMoles = {};

  pickNewTargetPair();

  // 1 分鐘計時器
  clearInterval(moleTimerInterval);
  moleTimerInterval = setInterval(() => {
    moleTimer--;
    document.getElementById('moleTimer').innerText = moleTimer;
    if (moleTimer <= 0) {
      finishMoleGame();
    }
  }, 1000);

  // 地鼠鑽出循環
  clearInterval(moleSpawnInterval);
  moleSpawnInterval = setInterval(spawnMoles, 1400);
  spawnMoles(); // 立即生成第一批
}

function pickNewTargetPair() {
  currentTargetPair = vocabPairs[Math.floor(Math.random() * vocabPairs.length)];
  // 隨機決定是 給英文找中文 還是 給中文找英文
  const enToZh = Math.random() > 0.5;
  if (enToZh) {
    document.getElementById('targetPromptTitle').innerText = "【英文題目】請打擊對應的『中文翻譯』地鼠：";
    document.getElementById('targetWordDisplay').innerText = currentTargetPair.en;
  } else {
    document.getElementById('targetPromptTitle').innerText = "【中文題目】請打擊對應的『English 英文』地鼠：";
    document.getElementById('targetWordDisplay').innerText = currentTargetPair.zh;
  }
  currentTargetPair.askEn = enToZh;
}

function spawnMoles() {
  // 縮回目前所有地鼠
  for (let i = 0; i < 9; i++) {
    const el = document.getElementById(`mole${i}`);
    el.className = 'mole-creature';
  }
  activeMoles = {};

  // 決定 2~3 個洞冒出地鼠
  const holeCount = Math.floor(Math.random() * 2) + 2; // 2 或 3
  const chosenHoles = [];
  while (chosenHoles.length < holeCount) {
    const r = Math.floor(Math.random() * 9);
    if (!chosenHoles.includes(r)) chosenHoles.push(r);
  }

  // 確保其中一個地鼠是正解！
  const correctHole = chosenHoles[0];
  const correctAnswerText = currentTargetPair.askEn ? currentTargetPair.zh : currentTargetPair.en;
  activeMoles[correctHole] = { text: correctAnswerText, isCorrect: true };

  // 其他洞填入干擾錯誤詞彙
  for (let idx = 1; idx < chosenHoles.length; idx++) {
    const h = chosenHoles[idx];
    let wrongPair;
    do {
      wrongPair = vocabPairs[Math.floor(Math.random() * vocabPairs.length)];
    } while (wrongPair.en === currentTargetPair.en);

    const wrongText = currentTargetPair.askEn ? wrongPair.zh : wrongPair.en;
    activeMoles[h] = { text: wrongText, isCorrect: false };
  }

  // 冒出動畫
  chosenHoles.forEach(h => {
    const el = document.getElementById(`mole${h}`);
    el.innerText = activeMoles[h].text;
    el.className = 'mole-creature up';
  });
}

function hitMole(holeIndex) {
  const moleInfo = activeMoles[holeIndex];
  if (!moleInfo) return; // 這個洞沒有地鼠

  const el = document.getElementById(`mole${holeIndex}`);
  if (moleInfo.isCorrect) {
    moleScore += 10;
    document.getElementById('moleScore').innerText = moleScore;
    el.classList.add('whacked-correct');
    delete activeMoles[holeIndex];

    // 打對立刻換下一組配對題目並生成新地鼠
    setTimeout(() => {
      pickNewTargetPair();
      spawnMoles();
    }, 300);
  } else {
    moleScore = Math.max(0, moleScore - 3);
    document.getElementById('moleScore').innerText = moleScore;
    el.classList.add('whacked-wrong');
    delete activeMoles[holeIndex];
  }
}

function endMoleGameEarly() {
  finishMoleGame();
}

function finishMoleGame() {
  clearInterval(moleTimerInterval);
  clearInterval(moleSpawnInterval);

  // 依得分轉化為額外的生命與金幣
  const bonusHp = Math.round(moleScore * 1.5);
  const bonusCoins = Math.round(moleScore * 0.8);
  gainExpAndCoins(bonusHp, bonusCoins);

  alert(`⏰ 1 分鐘打地鼠時間結束！\n🏆 本輪得分：${moleScore} 分！\n💖 額外為寵物灌注 +${bonusHp} HP 生命精華與 +${bonusCoins} 🪙 金幣！`);
  document.getElementById('moleModal').style.display = 'none';
  showPetDialogue(`「主人在打地鼠遊戲拿了 ${moleScore} 分！我又得到了好多能量～太好玩了！」`);
}

function renderLevelGrid(filter) {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  document.getElementById('gameArea').style.display = 'none';
  grid.style.display = 'grid';

  const filtered = gameData.levels.filter(lvl => {
    if (filter === 'all') return true;
    if (filter === 'zh' || filter === 'en') return lvl.language === filter;
    return lvl.tier === filter;
  });

  filtered.forEach(lvl => {
    const card = document.createElement('div');
    card.className = 'level-card';
    card.onclick = () => startLevel(lvl.id);

    const langBadge = lvl.language === 'zh' 
      ? '<span class="badge badge-zh">中文</span>' 
      : '<span class="badge badge-en">English</span>';
    
    card.innerHTML = `
      <div>
        ${langBadge}
        <span class="badge badge-tier">${lvl.grade_range}</span>
      </div>
      <div class="card-title">${lvl.title}</div>
      <div class="card-meta">
        <span>主題：${lvl.theme}</span>
        <span>⏱️ ${lvl.reading_time_sec}s</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

// 純文字自動解析並生成關卡演算法
function generateStoryFromPlainText() {
  const rawText = document.getElementById('quickStoryText').value.trim();
  if (!rawText) {
    alert("請先貼上故事文章內容喔！");
    return;
  }

  // 1. 自動切分段落
  const paragraphs = rawText
    .split(/\n+/)
    .map(p => p.trim())
    .filter(p => p.length > 0);

  if (paragraphs.length === 0) {
    alert("文章內容太短，請提供至少一段故事！");
    return;
  }

  // 2. 判斷語言 (中/英)
  let lang = document.getElementById('quickStoryLang').value;
  if (lang === 'auto') {
    // 依據是否包含中文字元判斷
    const hasChinese = /[\u4e00-\u9fa5]/.test(rawText);
    lang = hasChinese ? 'zh' : 'en';
  }

  // 3. 處理標題
  let title = document.getElementById('quickStoryTitle').value.trim();
  if (!title) {
    if (lang === 'zh') {
      title = paragraphs[0].slice(0, 14) + (paragraphs[0].length > 14 ? '...' : '');
    } else {
      const words = paragraphs[0].split(' ');
      title = words.slice(0, 5).join(' ') + '...';
    }
  }

  // 4. 年級標籤
  const tier = document.getElementById('quickStoryTier').value;
  const gradeLabels = {
    lower: "國小1-2年級",
    middle: "國小3-4年級",
    upper: "國小5-6年級"
  };

  // 5. 自動分析詞彙與生成智能閱讀題目
  const vocabulary = [];
  const questions = [];

  if (lang === 'zh') {
    // 簡易抓取文章內常見重要詞彙
    vocabulary.push({
      term: "智慧",
      pinyin: "ㄓˋ ㄏㄨㄟˋ",
      desc: "聰明且能解決問題的思考能力。"
    });
    
    // 生成理解題
    questions.push({
      question_id: "q1",
      type: "single_choice",
      question: `根據故事內容，主角在面對事情時主要發生了什麼事？`,
      options: [
        paragraphs[0].slice(0, 24) + "...",
        "故事中的角色在草地上睡著了",
        "天上下起了大雨，大家躲進了山洞",
        "事情突然解決了，大家都去慶祝"
      ],
      answer_index: 0,
      hint: "請仔細重讀故事的第一段，找找一開始發生的事情喔！",
      explanation: "第一段清楚交代了故事的開端與主角面臨的情況。"
    });

    const lastPara = paragraphs[paragraphs.length - 1];
    questions.push({
      question_id: "q2",
      type: "single_choice",
      question: `讀完這篇故事後，最後的結果或是帶給我們的啟發是什麼？`,
      options: [
        "大家什麼都沒有學到，事情結束了",
        lastPara.slice(0, 26) + "...",
        "主角最後離開了家鄉去遠方旅行",
        "所有人都決定不再提起這件事"
      ],
      answer_index: 1,
      hint: "請看故事的最後一段，尋找最後的結果或啟示！",
      explanation: "故事最後一段總結了整個發展與重要道理。"
    });
  } else {
    vocabulary.push({
      term: "adventure",
      phonetic: "/ədˈven.tʃər/",
      desc: "An exciting or remarkable experience."
    });

    questions.push({
      question_id: "q1",
      type: "single_choice",
      question: "What is the main beginning event described in the story?",
      options: [
        paragraphs[0].slice(0, 36) + "...",
        "The characters went to sleep immediately.",
        "Nothing interesting happened in the morning.",
        "They decided to cancel their journey."
      ],
      answer_index: 0,
      hint: "Re-read the first paragraph carefully to find how the story starts.",
      explanation: "The first paragraph introduces the main setting and opening action."
    });

    const lastPara = paragraphs[paragraphs.length - 1];
    questions.push({
      question_id: "q2",
      type: "single_choice",
      question: "What happened at the end of the story?",
      options: [
        "Everyone forgot what they were doing.",
        lastPara.slice(0, 38) + "...",
        "A huge dragon appeared and flew away.",
        "They stayed inside the house all day."
      ],
      answer_index: 1,
      hint: "Look at the final paragraph to see how the story concludes.",
      explanation: "The final paragraph tells the outcome of the adventure."
    });
  }

  // 6. 組裝關卡物件
  const newLevel = {
    id: "TEXT_" + Date.now(),
    language: lang,
    tier: tier,
    grade_range: gradeLabels[tier],
    theme: lang === 'zh' ? "自由閱讀創作" : "Free Reading",
    title: title,
    reading_time_sec: Math.max(30, Math.round(rawText.length / 5)),
    vocabulary: vocabulary,
    paragraphs: paragraphs,
    questions: questions
  };

  // 7. 注入遊戲資料庫並持久化儲存
  gameData.levels.unshift(newLevel);

  let customLevels = [];
  try {
    customLevels = JSON.parse(localStorage.getItem('reading_game_custom_levels') || '[]');
  } catch(e) {}
  customLevels.unshift(newLevel);
  localStorage.setItem('reading_game_custom_levels', JSON.stringify(customLevels));

  alert(`🎉 太棒了！已自動完成分段與題庫分析！\n關卡【${title}】已成功加入！`);
  closeAddStoryModal();
  renderLevelGrid('all');
}

// 啟動時自動載入使用者曾經新增過的自訂故事
function loadCustomLevels() {
  try {
    const customLevels = JSON.parse(localStorage.getItem('reading_game_custom_levels') || '[]');
    if (customLevels && customLevels.length > 0) {
      customLevels.forEach(clvl => {
        if (!gameData.levels.some(l => l.id === clvl.id)) {
          gameData.levels.unshift(clvl);
        }
      });
    }
  } catch(e) {}
}

let selectedWordToSpeak = "";

document.addEventListener("mouseup", handleTextSelection);

function handleTextSelection(e) {
  const tooltip = document.getElementById("selectionTooltip");
  if (!tooltip) return;

  // 如果點擊的是 tooltip 內部的按鈕，不要關閉或重置
  if (tooltip.contains(e.target)) return;

  const selection = window.getSelection();
  const rawText = selection.toString().trim();

  // 驗證是否在英文環境或選取了英文字詞
  if (!rawText || rawText.length === 0 || rawText.length > 35) {
    tooltip.style.display = "none";
    return;
  }

  // 清除前後標點符號，只留英文字母
  const cleanedWord = rawText.replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g, "");
  if (!cleanedWord || !/^[a-zA-Z\s'-]+$/.test(cleanedWord)) {
    tooltip.style.display = "none";
    return;
  }

  // 取得滑鼠或反白選取區域座標
  const range = selection.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  
  // 決定翻譯釋義
  const lower = cleanedWord.toLowerCase();
  let translation = builtInDict[lower];

  // 若內建查無，提供快速線上查詢 API / 本地解析
  if (!translation) {
    translation = "點擊發音聆聽，或連線查詢常用釋義";
    // 異步嘗試從免費字典 API 獲取
    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${lower}`)
      .then(res => res.json())
      .then(data => {
        if (data && data[0] && data[0].meanings && data[0].meanings[0]) {
          const def = data[0].meanings[0].definitions[0].definition;
          const pos = data[0].meanings[0].partOfSpeech;
          document.getElementById("tooltipTransText").innerHTML = `<em>(${pos})</em> ${def}`;
        }
      })
      .catch(() => {});
  }

  selectedWordToSpeak = cleanedWord;
  const gLink = document.getElementById("googleTranslateLink");
  if (gLink) {
    gLink.href = `https://translate.google.com/?sl=en&tl=zh-TW&text=${encodeURIComponent(cleanedWord)}&op=translate`;
  }
  document.getElementById("tooltipWordText").innerText = cleanedWord;
  document.getElementById("tooltipTransText").innerText = translation;

  // 顯示懸浮氣泡並計算位置 (避免超出視窗)
  tooltip.style.display = "block";
  const tooltipWidth = 240;
  const leftPos = Math.max(10, Math.min(window.innerWidth - tooltipWidth - 20, rect.left + window.scrollX));
  const topPos = rect.top + window.scrollY - 75;

  tooltip.style.left = `${leftPos}px`;
  tooltip.style.top = `${Math.max(10, topPos)}px`;
}

function speakTooltipWord() {
  if (selectedWordToSpeak) {
    speakText(selectedWordToSpeak, "en");
  }
}
